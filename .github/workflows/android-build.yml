name: Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Always generate app/google-services.json from the GitHub Actions secret.
      # Never fall back to a repository copy of google-services.json.
      - name: Create Google Services JSON from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::GitHub Actions secret GOOGLE_SERVICES_JSON_BASE64 is missing or unavailable."
            exit 1
          fi

          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          python3 -m json.tool "$RUNNER_TEMP/google-services.json" > /dev/null
          install -m 600 "$RUNNER_TEMP/google-services.json" app/google-services.json

          echo "Google Services JSON was created from GitHub Secret."
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("app/google-services.json").read_text())
          packages = sorted({
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
              for client in data.get("client", [])
              if client.get("client_info", {})
                       .get("android_client_info", {})
                       .get("package_name")
          })
          if not packages:
              raise SystemExit("ERROR: No Android package_name found in the GitHub Secret JSON.")
          print("Android package(s) in GitHub Secret: " + ", ".join(packages))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Android debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFXYamaha-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
